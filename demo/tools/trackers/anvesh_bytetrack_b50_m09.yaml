# ByteTrack settings for the demo (Ultralytics format). Differences from the library default bytetrack.yaml: track_buffer 30 -> 50 and match_thresh 0.8 -> 0.9.
tracker_type: bytetrack
track_high_thresh: 0.25
track_low_thresh: 0.1
new_track_thresh: 0.25
track_buffer: 50
match_thresh: 0.9
fuse_score: True
