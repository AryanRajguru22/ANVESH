[project]
name = "anvesh"
version = "0.1.0"
description = "ANVESH V1 -- corridor congestion-cause reasoning system (M0 foundation)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
anvesh = "anvesh.main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["anvesh*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
